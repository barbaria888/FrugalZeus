name: Build & Deploy Microservice

on:
  push:
    branches:
      - main
    paths:
      - 'microservice/**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: hardik0811/frugalzeus

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hardik0811
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./microservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in GitOps manifest
        run: |
          sed -i "s|image:.*frugalzeus.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" \
            platform-gitops/tenants/team-alpha/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add platform-gitops/tenants/team-alpha/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "ci: update team-alpha image to ${{ github.sha }} [skip ci]"
            git push
          fi
