apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Intra-namespace
    - from:
        - podSelector: {}
    # Prometheus scraping OTel metrics port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9464

  egress:
    # DNS (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Floci S3 (platform-infra)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-infra
      ports:
        - protocol: TCP
          port: 4566
    # Tempo OTLP HTTP (monitoring)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
    # Intra-namespace
    - to:
        - podSelector: {}
